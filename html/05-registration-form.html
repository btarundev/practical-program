<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>05 Student Registration</title><link rel="stylesheet" href="../css/style.css"></head>
<body><main class="container page-content"><h1>Student Registration Form</h1><form class="registration-form" action="#" method="post"><label for="name">Full name</label><input id="name" name="name" type="text" required><label for="email">Email</label><input id="email" name="email" type="email" required><label for="course">Course</label><select id="course" name="course"><option>Computer Science</option><option>Information Technology</option></select><fieldset><legend>Study mode</legend><label><input type="radio" name="mode" value="full-time" checked> Full-time</label><label><input type="radio" name="mode" value="part-time"> Part-time</label></fieldset><label><input type="checkbox" required> I accept the terms.</label><button type="submit">Register</button></form></main></body>
</html>
