<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>09 HTML5 Inputs</title><link rel="stylesheet" href="../css/style.css"></head>
<body><main class="container page-content"><h1>HTML5 Input Types</h1><form class="input-demo"><label for="email">Email<input id="email" type="email" placeholder="student@example.com"></label><label for="date">Date<input id="date" type="date"></label><label for="number">Number<input id="number" type="number" min="1" max="100"></label><label for="password">Password<input id="password" type="password" placeholder="Enter password"></label><button type="submit">Submit</button></form></main></body>
</html>
